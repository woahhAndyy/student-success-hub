{% extends "base.html" %}{% block title %}Create account{% endblock %}{% block content %}<section class="auth"><div class="authcard"><span class="eyebrow">START STRONG</span><h1>Create your account</h1><p>Your next semester starts with a plan.</p><form method="post"><label>Full name<input name="name" required autocomplete="name" placeholder="Your name"></label><label>Email address<input name="email" type="email" required autocomplete="email" placeholder="you@college.edu"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="At least 8 characters"></label><button class="btn full">Create account</button></form><p class="switch">Already registered? <a href="{{ url_for('login') }}">Sign in</a></p></div></section>{% endblock %}
