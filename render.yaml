services:
  - type: web
    name: student-success-hub
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /data/student_success_hub.db
    disk:
      name: student-success-data
      mountPath: /data
      sizeGB: 1
